<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenEval · H5测试合集</title>
  <style>
    :root{--bg:#060d1a;--card:rgba(12,21,37,.75);--border:rgba(38,208,206,.15);--accent:#26d0ce;--accent2:#ff8a65;--text:#fff;--gray:#7a96b8}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;top:0;left:0;width:50%;height:100%;background:radial-gradient(ellipse at top left,rgba(38,208,206,.08),transparent 70%);z-index:0}
    body::after{content:'';position:fixed;bottom:0;right:0;width:50%;height:100%;background:radial-gradient(ellipse at bottom right,rgba(255,138,101,.08),transparent 70%);z-index:0}
    .container{max-width:520px;margin:0 auto;padding:24px 20px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
    .header{text-align:center;margin:60px 0 40px}
    .logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(38,208,206,.2);transform:rotate(-5deg)}
    .title{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
    .subtitle{font-size:14px;color:var(--gray);margin-top:8px}
    .list{flex:1;display:flex;flex-direction:column;gap:16px}
    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:24px;cursor:pointer;transition:all .3s ease;text-decoration:none;color:inherit;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .3s}
    .card:hover{transform:translateY(-4px);border-color:var(--accent2);box-shadow:0 8px 32px rgba(255,138,101,.1)}
    .card:hover::before{opacity:1}
    .card-header{display:flex;align-items:center;gap:16px}
    .card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px rgba(38,208,206,.2)}
    .card-body{flex:1}
    .card-title{font-size:17px;font-weight:600;margin-bottom:4px}
    .card-desc{font-size:13px;color:var(--gray);line-height:1.5}
    .card-arrow{color:var(--gray);font-size:20px;transition:all .3s}
    .card:hover .card-arrow{color:var(--accent2);transform:translateX(4px)}
    .footer{text-align:center;padding:32px 0;color:var(--gray);font-size:12px;border-top:1px solid var(--border);margin-top:auto}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">💘</div>
    <h1 class="title">H5 测试合集</h1>
    <p class="subtitle">点击开始你的测试之旅</p>
  </div>
  <div class="list">
    <a class="card" href="anlian/">
      <div class="card-header">
        <div class="card-icon">💘</div>
        <div class="card-body">
          <div class="card-title">暗恋测试</div>
          <div class="card-desc">测测TA是不是也在偷偷喜欢你，20道题精准分析</div>
        </div>
        <div class="card-arrow">→</div>
      </div>
    </a>
    <!-- 新H5在这里添加，复制上面的card结构，改href/icon/title/desc即可 -->
  </div>
  <div class="footer">
    <div>更多测试即将上线，敬请期待</div>
  </div>
</div>
</body>
</html>
