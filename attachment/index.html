<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成人依恋类型评测</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-dark:#0a0e27;--bg-card:rgba(16,22,51,.75);--bg-card-hover:#1a2342;--border-color:rgba(99,102,241,.15);--c-secure:#10b981;--c-anxious:#f59e0b;--c-avoidant:#3b82f6;--c-fearful:#8b5cf6;--c-coral:#f97316;--text-white:#fff;--text-gray:#7a8ab8;--text-light:#a8b4e8;--gradient-main:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);--gradient-secure:linear-gradient(135deg,#10b981,#34d399);--gradient-anxious:linear-gradient(135deg,#f59e0b,#fbbf24);--gradient-avoidant:linear-gradient(135deg,#3b82f6,#60a5fa);--gradient-fearful:linear-gradient(135deg,#8b5cf6,#a78bfa);--radius-lg:20px;--radius-md:14px}
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-dark);color:var(--text-white);line-height:1.6;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;top:0;left:0;width:50%;height:100%;background:radial-gradient(ellipse at top left,rgba(99,102,241,.08),transparent 70%);z-index:0;pointer-events:none}
    body::after{content:'';position:fixed;bottom:0;right:0;width:50%;height:100%;background:radial-gradient(ellipse at bottom right,rgba(236,72,153,.06),transparent 70%);z-index:0;pointer-events:none}
    #particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .container{max-width:520px;margin:0 auto;padding:24px 20px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
    .header{text-align:center;margin-bottom:40px;animation:fadeInDown .6s ease}
    @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.15)}70%{transform:scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes slideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-30px)}}
    @keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes selectPulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}70%{box-shadow:0 0 0 10px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
    @keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
    .logo{width:100px;height:100px;margin:0 auto 20px;background:var(--gradient-main);border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(99,102,241,.25),0 0 60px rgba(139,92,246,.2);position:relative;animation:heartbeat 1.5s ease infinite;transform:rotate(-5deg)}
    .logo::before{content:'';position:absolute;inset:-3px;border-radius:28px;background:var(--gradient-main);z-index:-1;opacity:.5;filter:blur(12px)}
    .logo::after{content:'✨';position:absolute;top:-8px;right:-8px;font-size:20px;animation:sparkle 2s ease infinite}
    .logo-icon{font-size:48px}.title{font-size:32px;font-weight:700;margin-bottom:12px;background:var(--gradient-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
    .subtitle{font-size:15px;color:var(--text-gray)}.main-content{flex:1;display:flex;flex-direction:column;animation:fadeInUp .6s ease .2s both}
    .start-page{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fadeInUp .6s ease}
    .start-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius-lg);padding:40px 32px;border:1px solid var(--border-color);width:100%;max-width:420px;margin:0 auto;text-align:center}
    .start-icon{font-size:56px;margin-bottom:20px;animation:float 3s ease infinite}.start-title{font-size:22px;font-weight:600;color:var(--text-white);margin-bottom:8px}
    .start-desc{font-size:14px;color:var(--text-gray);margin-bottom:28px;line-height:1.6}
    .start-btn{width:100%;padding:18px 24px;background:var(--gradient-main);border:none;border-radius:var(--radius-md);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s ease;font-family:inherit;box-shadow:0 4px 20px rgba(99,102,241,.25)}
    .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(99,102,241,.35)}
    .start-hint{margin-top:24px;font-size:13px;color:var(--text-gray);opacity:.8}
    .disclaimer{background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--radius-md);padding:18px;margin-bottom:24px;border-left:4px solid var(--c-coral);border:1px solid var(--border-color)}
    .disclaimer-title{font-size:14px;font-weight:600;color:var(--c-coral);margin-bottom:8px;display:flex;align-items:center;gap:6px}.disclaimer-text{font-size:13px;color:var(--text-gray);line-height:1.6}
    .progress-container{margin-bottom:28px}.progress-bar{width:100%;height:8px;background:var(--border-color);border-radius:4px;overflow:hidden;margin-bottom:12px}
    .progress-fill{height:100%;background:var(--gradient-main);border-radius:4px;transition:width .5s ease;box-shadow:0 0 10px rgba(99,102,241,.3)}.progress-text{font-size:14px;color:var(--text-gray);text-align:center}
    .question-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border-color);margin-bottom:20px}
    .question-card.slide-in{animation:slideInRight .4s ease}.question-card.slide-out{animation:slideOutLeft .3s ease forwards}
    .question-number{display:inline-block;background:var(--gradient-main);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:16px}
    .question-text{font-size:17px;font-weight:500;color:var(--text-white);margin-bottom:24px;line-height:1.7}.options-grid{display:grid;gap:12px}
    .option-item{background:rgba(10,14,39,.6);border:2px solid var(--border-color);border-radius:var(--radius-md);padding:16px 20px;cursor:pointer;transition:all .25s ease;display:flex;align-items:center;gap:14px}
    .option-item:hover{border-color:var(--c-secure);background:rgba(99,102,241,.05)}
    .option-item.selected{border-color:#6366f1;background:rgba(99,102,241,.1);box-shadow:0 0 20px rgba(99,102,241,.15);animation:selectPulse .5s ease}
    .option-radio{width:22px;height:22px;border:2px solid var(--border-color);border-radius:6px;position:relative;flex-shrink:0;transition:all .25s ease}
    .option-item:hover .option-radio{border-color:#6366f1}.option-item.selected .option-radio{border-color:#6366f1;background:#6366f1}
    .option-item.selected .option-radio::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);width:6px;height:10px;border:solid var(--bg-dark);border-width:0 2px 2px 0}
    .option-label{font-size:15px;color:var(--text-light);font-weight:500;transition:color .25s ease}.option-item.selected .option-label{color:#a5b4fc}
    .navigation{display:flex;gap:12px;margin-top:24px}
    .btn{flex:1;padding:16px 24px;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;transition:all .3s ease;font-family:inherit}
    .btn-primary{background:var(--gradient-main);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.25)}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 30px rgba(99,102,241,.35)}
    .btn-secondary{background:var(--bg-card);color:var(--text-light);border:1px solid var(--border-color)}
    .btn-secondary:hover:not(:disabled){background:var(--bg-card-hover);border-color:#6366f1;color:#a5b4fc}
    .btn:disabled{opacity:.4;cursor:not-allowed}.auto-next-hint{text-align:center;font-size:12px;color:var(--text-gray);margin-top:16px;opacity:.7}
    .result-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius-lg);padding:32px;border:1px solid var(--border-color);text-align:center;margin-bottom:20px;position:relative;overflow:hidden}
    .result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradient-main)}
    .result-icon{font-size:64px;margin-bottom:20px;animation:heartbeat 1.5s ease infinite}
    .result-title{font-size:26px;font-weight:700;margin-bottom:12px;color:var(--text-white)}
    .result-type{font-size:18px;font-weight:600;margin-bottom:8px;padding:8px 24px;border-radius:30px;display:inline-block}
    .result-population{font-size:14px;color:var(--text-gray);margin-top:12px}
    .result-badge{display:inline-block;font-size:12px;color:var(--text-gray);background:rgba(99,102,241,.1);padding:4px 14px;border-radius:20px;margin-top:8px}
    .section-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius-lg);padding:24px;margin:16px 0;border:1px solid var(--border-color);text-align:left}
    .section-title{font-size:18px;font-weight:600;color:var(--text-white);margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .section-content{font-size:14px;color:var(--text-gray);line-height:1.8;white-space:pre-line}
    .type-badge{display:inline-block;background:var(--gradient-main);color:#fff;padding:8px 18px;border-radius:25px;font-size:14px;font-weight:600;margin-bottom:16px}
    .traits-list{list-style:none;padding:0}.traits-list li{padding:10px 0;border-bottom:1px solid var(--border-color);color:var(--text-light);font-size:14px;display:flex;align-items:flex-start;gap:10px}
    .traits-list li:last-child{border-bottom:none}.traits-list li::before{content:'🔹';font-size:14px;flex-shrink:0;margin-top:2px}
    .strengths-list{list-style:none;padding:0}.strengths-list li{padding:10px 0;border-bottom:1px solid var(--border-color);color:var(--text-light);font-size:14px;display:flex;align-items:flex-start;gap:10px}
    .strengths-list li:last-child{border-bottom:none}.strengths-list li::before{content:'💎';font-size:14px;flex-shrink:0;margin-top:2px}
    .challenges-list{list-style:none;padding:0}.challenges-list li{padding:10px 0;border-bottom:1px solid var(--border-color);color:var(--text-light);font-size:14px;display:flex;align-items:flex-start;gap:10px}
    .challenges-list li:last-child{border-bottom:none}.challenges-list li::before{content:'⚠️';font-size:14px;flex-shrink:0;margin-top:2px}
    .tips-list{list-style:none;padding:0}.tips-list li{padding:12px 0;border-bottom:1px solid var(--border-color);color:var(--text-light);font-size:14px;display:flex;align-items:flex-start;gap:10px;line-height:1.7}
    .tips-list li:last-child{border-bottom:none}.tips-list li::before{content:'🌱';font-size:16px;flex-shrink:0;margin-top:1px}
    .compat-box{background:rgba(10,14,39,.6);border-radius:var(--radius-md);padding:16px;border:1px solid var(--border-color);margin-bottom:12px}
    .compat-box:last-child{margin-bottom:0}.compat-type{font-size:14px;font-weight:600;margin-bottom:6px}
    .compat-desc{font-size:13px;color:var(--text-gray);line-height:1.6}
    .encourage-box{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(236,72,153,.05));border-radius:var(--radius-lg);padding:28px;margin:16px 0;border:1px solid rgba(99,102,241,.15);text-align:center}
    .encourage-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#a5b4fc}.encourage-text{font-size:14px;color:var(--text-light);line-height:1.8;white-space:pre-line}
    .dimension-item{margin-bottom:20px}.dimension-item:last-child{margin-bottom:0}
    .dimension-label{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--text-light);font-weight:500}
    .dimension-bar{width:100%;height:12px;background:var(--border-color);border-radius:6px;overflow:hidden}
    .dimension-fill{height:100%;border-radius:6px;transition:width .8s ease}
    .dimension-fill.secure{background:var(--gradient-secure);box-shadow:0 0 15px rgba(16,185,129,.4)}
    .dimension-fill.anxious{background:var(--gradient-anxious);box-shadow:0 0 15px rgba(245,158,11,.4)}
    .dimension-fill.avoidant{background:var(--gradient-avoidant);box-shadow:0 0 15px rgba(59,130,246,.4)}
    .dimension-fill.fearful{background:var(--gradient-fearful);box-shadow:0 0 15px rgba(139,92,246,.4)}
    .password-page{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;animation:fadeInUp .6s ease}
    .password-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius-lg);padding:40px 32px;border:1px solid var(--border-color);width:100%;max-width:380px;text-align:center}
    .password-icon{font-size:48px;margin-bottom:20px}.password-title{font-size:20px;font-weight:600;color:var(--text-white);margin-bottom:8px}
    .password-desc{font-size:14px;color:var(--text-gray);margin-bottom:24px}.password-input-wrap{position:relative;margin-bottom:20px}
    .password-input{width:100%;padding:16px 20px;background:rgba(10,14,39,.6);border:2px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-white);font-size:18px;font-family:inherit;text-align:center;letter-spacing:8px;transition:all .3s ease;outline:none}
    .password-input:focus{border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,.15)}
    .password-input.error{border-color:#ef4444;animation:shake .5s ease}.password-input::placeholder{letter-spacing:2px;color:var(--text-gray)}
    .password-error{color:#ef4444;font-size:13px;margin-top:-12px;margin-bottom:16px;display:none}.password-error.show{display:block}
    .password-btn{width:100%;padding:16px 24px;background:var(--gradient-main);border:none;border-radius:var(--radius-md);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s ease;font-family:inherit}
    .password-btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(99,102,241,.35)}.password-hint{margin-top:20px;font-size:12px;color:var(--text-gray);opacity:.7}
    .footer{margin-top:auto;text-align:center;padding:32px 0 24px;color:var(--text-gray);font-size:13px;border-top:1px solid var(--border-color)}
    .footer-note{font-size:11px;line-height:1.6;color:var(--text-gray);opacity:.7}
    .floating-hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
    .floating-heart{position:absolute;font-size:20px;opacity:0.1;animation:floatUp 15s linear infinite}
    @keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.1}90%{opacity:0.1}100%{transform:translateY(-100px) rotate(360deg);opacity:0}}
  </style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="floating-hearts" id="floating-hearts"></div>
<div class="container">
  <div class="header">
    <div class="logo"><div class="logo-icon" id="logo-icon">🧩</div></div>
    <h1 class="title" id="page-title">依恋类型评测</h1>
    <p class="subtitle" id="page-subtitle">了解你在亲密关系中的真实模式</p>
  </div>
  <div class="main-content" id="main-content"></div>
  <div class="footer">
    <div class="footer-note" id="footer-note">本评测基于成人依恋理论，仅供自我探索参考</div>
  </div>
</div>
<script>
/* ================================================================
 *  成人依恋类型评测 — 维度匹配引擎
 *  4维度: secure(安全) / anxious(焦虑) / avoidant(回避) / fearful(恐惧)
 *  最高维度 = 主要依恋类型
 * ================================================================ */

var QUESTIONS = [
  // 安全维度 (secure) — 高分=安全型
  { text: "当伴侣需要独处空间时，我能理解和尊重，不会因此感到不安", dim: "secure" },
  { text: "我相信即使发生矛盾和争吵，我们的关系也能修复", dim: "secure" },
  { text: "我能够自在地向伴侣表达自己的需求、脆弱和不安", dim: "secure" },
  { text: "我相信自己值得被爱，也相信伴侣对我的感情是真实的", dim: "secure" },
  { text: "当伴侣向我倾诉时，我能稳定地陪伴而不是被对方的情绪带走", dim: "secure" },

  // 焦虑维度 (anxious) — 高分=焦虑型
  { text: "伴侣几个小时没回消息，我就会坐立不安、反复看手机", dim: "anxious" },
  { text: "我经常翻看伴侣的社交动态，想确认对方的状态和行踪", dim: "anxious" },
  { text: "伴侣语气稍有变化，我就会想是不是自己做错了什么", dim: "anxious" },
  { text: "如果伴侣和别人走得近，我会非常不安甚至吃醋", dim: "anxious" },
  { text: "我需要伴侣反复表达爱意和承诺，才能感到安心", dim: "anxious" },

  // 回避维度 (avoidant) — 高分=回避型
  { text: "当有人想深入了解我的内心世界时，我会下意识地想后退", dim: "avoidant" },
  { text: "我更习惯自己解决问题，不太愿意麻烦或依赖伴侣", dim: "avoidant" },
  { text: "关系一旦变得很亲密，我会觉得有点不自在或窒息", dim: "avoidant" },
  { text: "伴侣说\"我们需要好好谈谈\"时，我的第一反应是回避或转移话题", dim: "avoidant" },
  { text: "我觉得过度依赖另一个人是危险的，我需要随时能抽身的自由", dim: "avoidant" },

  // 恐惧维度 (fearful) — 高分=恐惧型
  { text: "我渴望亲密关系，但同时又害怕在关系中受到伤害", dim: "fearful" },
  { text: "伴侣靠近时我想逃，伴侣冷淡时我又焦虑不安，总是反复拉扯", dim: "fearful" },
  { text: "我觉得自己既不值得被爱，也不相信有人能一直爱我", dim: "fearful" },
  { text: "每段关系刚开始时，我心里就觉得它迟早会结束", dim: "fearful" },
  { text: "我在\"想靠近\"和\"不想受伤\"之间反复挣扎，很难做出选择", dim: "fearful" }
];

var OPTIONS = [
  { label: "从不这样", value: 0 },
  { label: "偶尔这样", value: 1 },
  { label: "有时这样", value: 2 },
  { label: "经常这样", value: 3 },
  { label: "总是这样", value: 4 }
];

var RESULTS = {
  secure: {
    type: "安全型依恋",
    en: "Secure Attachment",
    icon: "🌟",
    gradient: "var(--gradient-secure)",
    population: "约50%的人群属于安全型",
    badge: "成年人的爱，从安全感开始",
    description: "你拥有健康的依恋模式。你既能够享受亲密，也能保持独立。在关系中，你信任伴侣、相信自己值得被爱，并且能够在亲密与自主之间找到平衡。这是四种依恋类型中最健康、最稳定的一种。\n\n你不是没有脆弱的时刻，但你有一种内在的能力——在受伤后能够自我修复，在冲突后愿意主动修复关系。你的安全感不是来自关系的完美，而是来自对自己和对人的基本信任。",
    traits: [
      "能够自在地表达情感需求，不压抑也不夸大",
      "尊重伴侣的独处空间，不会因为距离而过度焦虑",
      "争吵后愿意主动沟通和修复，不冷战不逃避",
      "相信自己值得被爱，也相信他人的善意",
      "在亲密与独立之间找到自然的平衡",
      "能够接纳伴侣的不完美，不要求对方完美"
    ],
    strengths: [
      "情绪稳定，不会因为小事就陷入崩溃或过度反应",
      "善于沟通，能直接表达需要而不是用沉默或冷战",
      "给伴侣安全感，对方和你在一起时感到被信任和被接纳",
      "面对关系中的挑战有韧性，不轻易放弃",
      "能成为伴侣的情绪锚，在对方波动时提供稳定"
    ],
    challenges: [
      "可能过于理性，忽略了关系中需要更多感性的表达",
      "面对极度焦虑或极度回避的伴侣时，耐心可能被消耗",
      "容易觉得\"没什么大不了\"，忽视了对方需要的情感回应",
      "在关系初期可能因为太稳定而被误解为\"不够热情\""
    ],
    tips: [

class ParticleSystem{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');this.particles=[];
    this.mouse={x:null,y:null,radius:150};
    this.colors=['#6366f1','#8b5cf6','#ec4899','#3b82f6','#a5b4fc','#c4b5fd','#f9a8d4'];
    this.resize();this.init();this.animate();
    window.addEventListener('resize',()=>{this.resize();this.init()});
    window.addEventListener('mousemove',(e)=>{this.mouse.x=e.x;this.mouse.y=e.y});
    window.addEventListener('mouseout',()=>{this.mouse.x=null;this.mouse.y=null});
  }
  resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight}
  init(){
    this.particles=[];
    var num=Math.floor((this.canvas.width*this.canvas.height)/6000);
    for(var i=0;i<num;i++){
      var size=Math.random()*2.5+0.5;
      var x=Math.random()*this.canvas.width,y=Math.random()*this.canvas.height;
      this.particles.push({x:x,y:y,size:size,speedX:(Math.random()-0.5)*0.6,speedY:(Math.random()-0.5)*0.6,color:this.colors[Math.floor(Math.random()*this.colors.length)],opacity:Math.random()*0.5+0.2,baseX:x,baseY:y});
    }
  }
  drawParticle(p){this.ctx.beginPath();this.ctx.arc(p.x,p.y,p.size,0,Math.PI*2);this.ctx.fillStyle=p.color;this.ctx.globalAlpha=p.opacity;this.ctx.fill();this.ctx.globalAlpha=1}
  connectParticles(){
    var maxDist=80;
    for(var i=0;i<this.particles.length;i++){
      for(var j=i+1;j<this.particles.length;j++){
        var dx=this.particles[i].x-this.particles[j].x,dy=this.particles[i].y-this.particles[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<maxDist){
          this.ctx.beginPath();this.ctx.strokeStyle=this.particles[i].color;
          this.ctx.globalAlpha=(1-dist/maxDist)*0.2;this.ctx.lineWidth=0.5;
          this.ctx.moveTo(this.particles[i].x,this.particles[i].y);
          this.ctx.lineTo(this.particles[j].x,this.particles[j].y);
          this.ctx.stroke();this.ctx.globalAlpha=1;
        }
      }
    }
  }
  update(){
    for(var p of this.particles){
      if(this.mouse.x!==null){
        var dx=this.mouse.x-p.x,dy=this.mouse.y-p.y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<this.mouse.radius){
          var force=(this.mouse.radius-dist)/this.mouse.radius;
          p.x-=dx/dist*force*2;p.y-=dy/dist*force*2;
        }
      }
      p.x+=(p.baseX-p.x)*0.012+p.speedX;p.y+=(p.baseY-p.y)*0.012+p.speedY;
      if(p.x<0||p.x>this.canvas.width)p.speedX*=-1;
      if(p.y<0||p.y>this.canvas.height)p.speedY*=-1;
    }
  }
  animate(){
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    for(var p of this.particles)this.drawParticle(p);
    this.connectParticles();this.update();
    requestAnimationFrame(()=>this.animate());
  }
}

function showPasswordPage(){
  var pc=getPasswordConfig();
  var h='<div class="password-page"><div class="password-card">';
  h+='<div class="password-icon">'+pc.icon+'</div>';
  h+='<div class="password-title">'+pc.title+'</div>';
  h+='<div class="password-desc">'+pc.desc+'</div>';
  h+='<div class="password-input-wrap">';
  h+='<input type="password" class="password-input" id="password-input" placeholder="••••" maxlength="'+pc.value.length+'" oninput="checkPassword()" onkeypress="if(event.keyCode===13)verifyPassword()">';
  h+='</div>';
  h+='<div class="password-error" id="password-error">'+pc.errorText+'</div>';
  h+='<button class="password-btn" onclick="verifyPassword()">'+pc.btnText+'</button>';
  h+='<div class="password-hint">'+pc.hint+'</div>';
  h+='</div></div>';
  document.getElementById('main-content').innerHTML=h;
}

function checkPassword(){
  document.getElementById('password-input').classList.remove('error');
  document.getElementById('password-error').classList.remove('show');
}

function verifyPassword(){
  var input=document.getElementById('password-input');
  if(input.value===getPasswordConfig().value){
    showStartPage();
  }else{
    input.classList.add('error');
    document.getElementById('password-error').classList.add('show');
    input.value='';
  }
}

function showStartPage(){
  var h='<div class="start-page"><div class="start-card">';
  h+='<div class="start-icon">🧩</div>';
  h+='<div class="start-title">成人依恋类型评测</div>';
  h+='<div class="start-desc">从日常相处出发，分析你在亲密关系中的依恋模式。基于成人依恋理论，帮助你了解自己与他人建立情感联结的方式。</div>';
  h+='<button class="start-btn" onclick="startTest()">开始评测 ✨</button>';
  h+='<div class="start-hint">🔮 约3-5分钟完成</div>';
  h+='</div></div>';
  h+='<div class="disclaimer">';
  h+='<div class="disclaimer-title">💝 关于本次评测</div>';
  h+='<div class="disclaimer-text">依恋类型没有好坏之分，每种类型都有其形成的原因和独特的力量。请根据你在<strong>亲密关系中的真实表现</strong>来回答，而非你希望成为的样子。越诚实，结果越准确。</div>';
  h+='</div>';
  document.getElementById('main-content').innerHTML=h;
}

function startTest(){
  testData.currentQuestion=0;
  testData.isTransitioning=false;
  testData.answers=new Array(QUESTIONS.length).fill(null);
  showQuestion();
}

function showQuestion(animate){
  var q=QUESTIONS,o=OPTIONS;
  var p=((testData.currentQuestion+1)/q.length)*100;
  var h='<div class="progress-container">';
  h+='<div class="progress-bar"><div class="progress-fill" style="width:'+p+'%"></div></div>';
  h+='<div class="progress-text">第 '+(testData.currentQuestion+1)+' 题，共 '+q.length+' 题</div></div>';
  h+='<div class="question-card'+(animate?' slide-in':'')+'" id="question-card">';
  h+='<div class="question-number">Q'+(testData.currentQuestion+1)+'</div>';
  h+='<div class="question-text">'+q[testData.currentQuestion].text+'</div>';
  h+='<div class="options-grid">';
  for(var i=0;i<o.length;i++){
    h+='<div class="option-item'+(testData.answers[testData.currentQuestion]===o[i].value?' selected':'')+'" onclick="selectOption('+o[i].value+')">';
    h+='<div class="option-radio"></div>';
    h+='<div class="option-label">'+o[i].label+'</div></div>';
  }
  h+='</div>';
  h+='<div class="auto-next-hint">✨ 选择后自动跳转下一题</div></div>';
  h+='<div class="navigation">';
  h+='<button class="btn btn-secondary" onclick="previousQuestion()"'+(testData.currentQuestion===0?' disabled':'')+'>← 上一题</button>';
  h+='<button class="btn btn-primary" onclick="nextQuestion()"'+(testData.answers[testData.currentQuestion]===null?' disabled':'')+'>';
  h+=(testData.currentQuestion===q.length-1?'查看结果 🧩':'下一题 →')+'</button></div>';
  document.getElementById('main-content').innerHTML=h;
}

function selectOption(v){
  if(testData.isTransitioning)return;
  testData.answers[testData.currentQuestion]=v;
  var opts=document.querySelectorAll('.option-item');
  opts.forEach(function(o){o.classList.remove('selected')});
  OPTIONS.forEach(function(o,i){if(o.value===v)opts[i].classList.add('selected')});
  if(testData.currentQuestion<QUESTIONS.length-1){
    testData.isTransitioning=true;
    document.getElementById('question-card').classList.add('slide-out');
    setTimeout(function(){testData.currentQuestion++;testData.isTransitioning=false;showQuestion(true)},350);
  }else{
    setTimeout(function(){showResult()},400);
  }
}

function nextQuestion(){
  if(testData.isTransitioning)return;
  if(testData.currentQuestion<QUESTIONS.length-1){
    testData.isTransitioning=true;
    document.getElementById('question-card').classList.add('slide-out');
    setTimeout(function(){testData.currentQuestion++;testData.isTransitioning=false;showQuestion(true)},350);
  }else{showResult()}
}

function previousQuestion(){
  if(testData.isTransitioning)return;
  if(testData.currentQuestion>0){testData.currentQuestion--;showQuestion(true)}
}

function showResult(){
  var a=testData.answers;
  var dims={secure:0,anxious:0,avoidant:0,fearful:0};
  for(var i=0;i<a.length;i++){
    var dim=QUESTIONS[i].dim;
    dims[dim]+=a[i];
  }
  // 找最高维度
  var maxDim='secure',maxVal=-1;
  var dimKeys=['secure','anxious','avoidant','fearful'];
  for(var i=0;i<dimKeys.length;i++){
    if(dims[dimKeys[i]]>maxVal){maxVal=dims[dimKeys[i]];maxDim=dimKeys[i]}
  }
  var r=RESULTS[maxDim];
  var maxScore=20; // 每维度5题×4分=20

  var h='';

  // 结果卡
  h+='<div class="result-card">';
  h+='<div class="result-icon">'+r.icon+'</div>';
  h+='<div class="result-title">'+r.type+'</div>';
  h+='<div class="result-type" style="background:'+r.gradient+';color:#fff">'+r.en+'</div>';
  h+='<div class="result-badge">'+r.badge+'</div>';
  h+='<div class="result-population">'+r.population+'</div>';
  h+='</div>';

  // 维度得分
  h+='<div class="section-card">';
  h+='<div class="section-title">📊 四维度得分</div>';
  for(var i=0;i<dimKeys.length;i++){
    var dk=dimKeys[i];
    var pct=Math.round((dims[dk]/maxScore)*100);
    var label={secure:'安全型',anxious:'焦虑型',avoidant:'回避型',fearful:'恐惧型'}[dk];
    var icon={secure:'🌟',anxious:'🌊',avoidant:'🏔️',fearful:'🌙'}[dk];
    var isMain=dk===maxDim;
    h+='<div class="dimension-item">';
    h+='<div class="dimension-label"><span>'+icon+' '+label+(isMain?' ← 你的类型':'')+'</span><span>'+dims[dk]+'/'+maxScore+'</span></div>';
    h+='<div class="dimension-bar"><div class="dimension-fill '+dk+'" style="width:'+pct+'%"></div></div></div>';
  }
  h+='</div>';

  // 类型描述
  h+='<div class="section-card">';
  h+='<div class="section-title">💌 类型解读</div>';
  h+='<div class="type-badge">'+r.type+'</div>';
  h+='<div class="section-content">'+r.description+'</div>';
  h+='</div>';

  // 核心特征
  h+='<div class="section-card">';
  h+='<div class="section-title">🔹 核心特征</div>';
  h+='<ul class="traits-list">';
  r.traits.forEach(function(t){h+='<li>'+t+'</li>'});
  h+='</ul></div>';

  // 关系中的优势
  h+='<div class="section-card">';
  h+='<div class="section-title">💎 你在关系中的优势</div>';
  h+='<ul class="strengths-list">';
  r.strengths.forEach(function(t){h+='<li>'+t+'</li>'});
  h+='</ul></div>';

  // 需要注意的挑战
  h+='<div class="section-card">';
  h+='<div class="section-title">⚠️ 需要觉察的挑战</div>';
  h+='<div class="section-content" style="font-size:13px;opacity:.8;margin-bottom:12px">了解挑战不是否定你，而是给你一面镜子，看见可以成长的方向。</div>';
  h+='<ul class="challenges-list">';
  r.challenges.forEach(function(t){h+='<li>'+t+'</li>'});
  h+='</ul></div>';

  // 成长建议
  h+='<div class="section-card">';
  h+='<div class="section-title">🌱 成长建议</div>';
  h+='<ul class="tips-list">';
  r.tips.forEach(function(t){h+='<li>'+t+'</li>'});
  h+='</ul></div>';

  // 类型匹配
  h+='<div class="section-card">';
  h+='<div class="section-title">💞 与其他类型的匹配</div>';
  r.compat.forEach(function(c){
    h+='<div class="compat-box"><div class="compat-type">'+c.type+'</div><div class="compat-desc">'+c.desc+'</div></div>';
  });
  h+='</div>';

  // 情感寄语
  h+='<div class="encourage-box">';
  h+='<div class="encourage-title">🌙 写给你的话</div>';
  h+='<div class="encourage-text">'+r.encourage+'</div>';
  h+='</div>';

  // 免责
  h+='<div class="section-card" style="border-left:4px solid var(--c-coral)">';
  h+='<div class="section-title" style="color:var(--c-coral)">💝 温馨提示</div>';
  h+='<div class="section-content" style="font-size:13px">依恋类型不是标签，而是一个了解自己的起点。我们的依恋模式通常形成于早期经验，但它是可以改变的——通过自我觉察、安全的关系体验以及必要的专业支持。本评测仅供自我探索参考，如有深层情感困扰，建议寻求专业心理咨询师的帮助。</div>';
  h+='</div>';

  // 按钮
  h+='<div class="navigation" style="margin-top:24px">';
  h+='<button class="btn btn-secondary" onclick="restartTest()">🔄 重新评测</button>';
  h+='<button class="btn btn-primary" onclick="goHome()">🏠 返回首页</button></div>';

  document.getElementById('main-content').innerHTML=h;
  // 滚动到顶部
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartTest(){
  testData.currentQuestion=0;
  testData.answers=new Array(QUESTIONS.length).fill(null);
  showQuestion();
}

function goHome(){
  showStartPage();
}

// 启动
createFloatingEmojis();
new ParticleSystem(document.getElementById('particles-canvas'));
initPage();
</script>
</body>
</html>
